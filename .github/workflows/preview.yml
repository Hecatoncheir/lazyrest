name: Preview Assets

# The preview stopped matching the interface once already: the page promised
# frames while the picture showed none. This job cannot judge whether a picture
# still looks right, but it catches the mechanical half — a tape that can no
# longer drive the application at all — before the assets are regenerated by
# hand and found wanting.
#
# It renders but never commits. Every run differs anyway: the frames carry
# timestamps, so committing them would add a binary diff to every push.

on:
  push:
    branches: ["main"]
    paths:
      - "preview.tape"
      - "scripts/preview.sh"
      - "ui/**"
      - "runner/**"
      - ".claude/skills/run-lazyrest/echo-server/**"
      - ".github/workflows/preview.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "preview.tape"
      - "scripts/preview.sh"
      - "ui/**"
      - "runner/**"
      - ".claude/skills/run-lazyrest/echo-server/**"
      - ".github/workflows/preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # The tape records under fish, which a runner does not carry, and the
      # script encodes with ffmpeg rather than letting VHS do it.
      - name: Install the shells and tools the tape needs
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fish ffmpeg

      - name: Install VHS
        uses: charmbracelet/vhs-action@v2

      - name: Render the preview
        run: scripts/preview.sh

      - name: Check the render arrived somewhere
        run: |
          set -euo pipefail
          for asset in site/assets/preview-stream.png preview-stream.gif; do
            test -s "$asset" || { echo "$asset was not produced" >&2; exit 1; }
            echo "$asset: $(wc -c < "$asset") bytes"
          done

      - name: Upload the render
        uses: actions/upload-artifact@v7
        with:
          name: preview
          path: |
            site/assets/preview-stream.png
            preview-stream.gif
          if-no-files-found: error
