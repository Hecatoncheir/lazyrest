name: Go Tests and Release

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Important to fetch all history for changelog parsing

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Verify module files
        run: go mod tidy && git diff --exit-code

      - name: Run go vet
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -race ./...

      - name: Build Project
        run: go build -v ./...

      - name: Verify the build needs no C toolchain
        env:
          CGO_ENABLED: "0"
        run: go build -v ./...

  binaries:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # The build is pure Go, so every target comes off one runner without a
      # cross compiler.
      - name: Build every target
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            extension=""
            if [ "$goos" = "windows" ]; then
              extension=".exe"
            fi
            rm -rf build
            mkdir -p build
            GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" -o "build/lazyrest$extension" .
            cp LICENSE README.md build/
            if [ "$goos" = "windows" ]; then
              (cd build && zip -qr "../dist/lazyrest-$goos-$goarch.zip" .)
            else
              tar -czf "dist/lazyrest-$goos-$goarch.tar.gz" -C build .
            fi
          done

      - name: Upload archives
        uses: actions/upload-artifact@v7
        with:
          name: archives
          path: dist/*
          if-no-files-found: error

  release:
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Extract Changelog
        id: changelog
        run: |
          # Get the current tag (e.g., v0.1.0)
          TAG=${GITHUB_REF#refs/tags/}
          # Search for the section in CHANGELOG.md starting with ## [tag] 
          # and extract everything until the next ## section or end of file
          CHANGELOG=$(sed -n "/## \[$TAG\]/,/## \[/p" CHANGELOG.md | sed '1d;$d')
          # Escape special characters for GH output
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog.outputs.body }}
          files: dist/*
          generate_release_notes: false # We are providing our own from changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
