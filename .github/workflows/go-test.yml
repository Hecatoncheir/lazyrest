name: Go Tests

on: 
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go_version: '1.22'

      - name: Install Dependencies
        run: |
          go mod tidy

      - name: Run Unit Tests
        run: go test ./...

      - name: Build Project
        run: go build -v ./...
