name: Go Tests and Release

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Important to fetch all history for changelog parsing

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Verify module files
        run: go mod tidy && git diff --exit-code

      - name: Run go vet
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -race ./...

      - name: Build Project
        run: go build -v ./...

  binaries:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Tree-sitter needs CGO, so every target is built on a runner that can
          # produce it natively or with a cross compiler from apt.
          - os: ubuntu-22.04
            goos: linux
            goarch: amd64
            name: lazyrest-linux-amd64
          - os: ubuntu-22.04
            goos: linux
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
            packages: gcc-aarch64-linux-gnu
            name: lazyrest-linux-arm64
          # Intel macOS runners are scarce, so darwin/amd64 is cross compiled
          # on the arm64 runner. Apple ships a universal SDK and Go passes the
          # matching -arch to clang, so CGO works either way.
          - os: macos-latest
            goos: darwin
            goarch: amd64
            name: lazyrest-darwin-amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            name: lazyrest-darwin-arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            extension: .exe
            name: lazyrest-windows-amd64
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install cross compiler
        if: matrix.packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          if [ -n "${{ matrix.cc }}" ]; then
            export CC="${{ matrix.cc }}"
          fi
          mkdir -p build
          go build -trimpath -ldflags "-s -w" -o "build/lazyrest${{ matrix.extension }}" .

      - name: Package
        shell: bash
        run: |
          cp LICENSE README.md build/
          mkdir -p dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            (cd build && 7z a "../dist/${{ matrix.name }}.zip" .)
          else
            tar -czf "dist/${{ matrix.name }}.tar.gz" -C build .
          fi

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Extract Changelog
        id: changelog
        run: |
          # Get the current tag (e.g., v0.1.0)
          TAG=${GITHUB_REF#refs/tags/}
          # Search for the section in CHANGELOG.md starting with ## [tag] 
          # and extract everything until the next ## section or end of file
          CHANGELOG=$(sed -n "/## \[$TAG\]/,/## \[/p" CHANGELOG.md | sed '1d;$d')
          # Escape special characters for GH output
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog.outputs.body }}
          files: dist/*
          generate_release_notes: false # We are providing our own from changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
